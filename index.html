<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0e1013">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ArchiKHC FamilyBoard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%238ab4ff'/%3E%3Cpath d='M15 33L32 18l17 15v15H15z' fill='white'/%3E%3Ccircle cx='32' cy='37' r='4.5' fill='%23ff9a76'/%3E%3C/svg%3E">
<style>
:root{--bg:#0e1013;--card:#16191e;--card2:#1e2228;--line:#262b33;--tx:#eceef1;--mu:#878e99;--ac:#8ab4ff;--fam:#8ab4ff;--kid:#ff9a76;--hol:#ff7a85;--ok:#6fd3a0;--warn:#ffcf66;--bad:#ff7a7a;--r:18px}
[data-theme=light]{--bg:#eef0f3;--card:#fff;--card2:#f3f4f7;--line:#e3e6eb;--tx:#1a1d22;--mu:#7a818c;--ac:#3b6ef5;--fam:#3b6ef5;--kid:#ee6a3a;--hol:#e5484d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
input,textarea,select{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{width:1.25em;height:1.25em;vertical-align:-.25em;flex:0 0 auto}
#app{position:absolute;left:0;right:0;top:0;bottom:3.7rem;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));grid-gap:.75rem;padding:.75rem .75rem 0}
#app.port{grid-template-rows:none;grid-auto-rows:7.2vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:.75rem}
.tile{min-width:0;min-height:0;height:100%}
.tile.hidden{display:none!important}
.zb{position:absolute;right:.35rem;top:.35rem;width:1.7rem;height:1.7rem;border-radius:8px;color:var(--mu);opacity:.45;z-index:3;font-size:.9rem;line-height:1.7rem;text-align:center}
.zb:hover{opacity:1}
.card>.hd{padding-right:1.6rem}
.tile.zoomed{position:fixed!important;z-index:45;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#zoomBg{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:44;display:none}
/* 배치 편집 */
#app.editing .tile{outline:2px dashed var(--ac);outline-offset:-2px;cursor:move;touch-action:none}
#app.editing .tile>*:not(.eh){pointer-events:none}
.eh{display:none}
#app.editing .eh{display:block;position:absolute;left:0;top:0;right:0;bottom:0;z-index:5;background:rgba(80,120,255,.08);border-radius:var(--r)}
.eh .nm{position:absolute;left:.6rem;top:.5rem;background:var(--ac);color:#fff;font-size:.8rem;font-weight:600;padding:.2rem .6rem;border-radius:999px}
.eh .rs{position:absolute;right:0;bottom:0;width:2.6rem;height:2.6rem;cursor:nwse-resize;touch-action:none}
.eh .rs:after{content:"";position:absolute;right:.5rem;bottom:.5rem;width:1rem;height:1rem;border-right:3px solid var(--ac);border-bottom:3px solid var(--ac)}
.eh .tb{position:absolute;right:.4rem;top:.4rem;display:flex}
.eh .tb button{background:var(--card);border:1px solid var(--line);border-radius:8px;min-width:2.1rem;height:2.1rem;margin-left:.25rem;font-size:.85rem;font-weight:700}
#editBar{position:fixed;left:50%;top:.6rem;transform:translateX(-50%);z-index:60;background:var(--card);border:1px solid var(--ac);border-radius:999px;padding:.35rem;display:none;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#editBar.on{display:flex}
#editBar span{font-size:.85rem;color:var(--mu);margin:0 .6rem}
#editBar button{padding:.45rem .9rem;border-radius:999px;font-size:.88rem;margin-left:.2rem;background:var(--card2)}
#editBar button.pri{background:var(--ac);color:#fff;font-weight:600}
/* 할 일 */
.todo{display:flex;flex-direction:column}
.todo .hd h2{color:var(--tx);font-size:1rem}
.prog{height:.45rem;border-radius:999px;background:var(--card2);overflow:hidden;margin:-.2rem 0 .6rem}
.prog i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.tdl{flex:1;overflow-y:auto}
.td{display:flex;align-items:center;width:100%;text-align:left;padding:.55rem .4rem;border-bottom:1px solid var(--line);font-size:1.15rem;line-height:1.3}
.td .bx{flex:0 0 auto;width:1.7rem;height:1.7rem;border-radius:8px;border:2.5px solid var(--kid);margin-right:.7rem;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.05rem;font-weight:700}
.td .tx{flex:1;min-width:0}
.td .tx small{display:block;font-size:.75rem;color:var(--mu)}
.td.done .bx{background:var(--ok);border-color:var(--ok)}
.td.done .tx{text-decoration:line-through;text-decoration-thickness:2px;color:var(--mu)}
.td.soon .tx{color:var(--kid);font-weight:700}
.td.late .tx small{color:var(--bad)}
.alldone{text-align:center;font-size:1.1rem;padding:.8rem 0;color:var(--ok);font-weight:600}
.todo.urgent{box-shadow:inset 0 0 0 2px var(--kid)}
#remind{position:fixed;left:50%;top:1rem;transform:translateX(-50%);z-index:70;background:var(--kid);color:#fff;border-radius:22px;padding:1rem 1.6rem;font-size:1.6rem;font-weight:700;box-shadow:0 10px 40px rgba(0,0,0,.45);display:none;align-items:center;max-width:92%}
#remind.on{display:flex;animation:bob 1.6s infinite}
#remind button{margin-left:1.1rem;background:#fff;color:var(--kid);border-radius:14px;padding:.5rem .9rem;font-size:1.05rem;font-weight:700;white-space:nowrap}
@keyframes bob{50%{transform:translateX(-50%) scale(1.03)}}
#frame .ftodo{position:absolute;right:2rem;top:1.6rem;background:rgba(0,0,0,.55);color:#fff;border-radius:16px;padding:.8rem 1.1rem;font-size:1.15rem;max-width:40%}
#frame .ftodo b{display:block;font-size:.85rem;opacity:.75;margin-bottom:.3rem}
/* 월간 달력 */
.mhd{display:flex;align-items:center;margin-bottom:.6rem}
.mhd h2{flex:1;margin:0;font-size:1.25rem}
.mhd .btn{margin-left:.35rem}
.mgrid{border-top:1px solid var(--line)}
.mdow{display:grid;grid-template-columns:repeat(7,1fr);font-size:.75rem;color:var(--mu);text-align:center;padding:.3rem 0}
.mdow span:first-child{color:var(--hol)}.mdow span:last-child{color:var(--ac)}
.mwk{position:relative;display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);min-height:6.2rem}
.mday{border-right:1px solid var(--line);padding:.2rem .3rem;font-size:.8rem;text-align:left;min-height:6.2rem;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.mday:last-child{border-right:0}
.mday b{display:inline-block;font-weight:600;min-width:1.5rem;text-align:center;border-radius:999px;padding:.05rem .2rem}
.mday.out b{opacity:.35}
.mday.sun b,.mday.hol b{color:var(--hol)}.mday.sat b{color:var(--ac)}
.mday.today b{background:var(--ac);color:#fff}
.mbars{position:absolute;left:0;right:0;top:1.55rem;pointer-events:none}
.mbar{position:absolute;height:1.15rem;line-height:1.15rem;font-size:.72rem;padding:0 .35rem;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;pointer-events:auto;cursor:pointer}
.mbar.t{background:none!important;color:var(--tx);padding-left:.2rem}
.mbar.t i{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;margin-right:.25rem;vertical-align:.05rem}
.mbar.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.mbar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.mmore{position:absolute;font-size:.68rem;color:var(--mu);pointer-events:none}
.box.full{max-width:none;width:96%;max-height:95%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;min-height:0;position:relative;overflow:hidden}
.hd{display:flex;align-items:center;margin-bottom:.6rem}
.hd h2{font-size:.82rem;font-weight:600;color:var(--mu);letter-spacing:.04em;flex:1}
.err{font-size:.78rem;color:var(--mu);padding:.3rem 0}
.mu{color:var(--mu)}
/* 시계 */
.clock{padding:1.1rem 1.2rem 1rem}
.tm{display:flex;align-items:flex-end;line-height:.9}
#time{font-size:5.3rem;font-weight:300;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
#ampm{font-size:1.1rem;color:var(--mu);margin:0 0 .5rem .5rem;font-weight:500}
#date{font-size:1.15rem;margin-top:.6rem;font-weight:500}
#greet{font-size:.9rem;color:var(--mu);margin-top:.25rem}
/* 날씨 */
.weather{display:flex;flex-direction:column;overflow-y:auto}
.wnow{display:flex;align-items:center}
.wnow .big{width:4.2rem;height:4.2rem;color:var(--warn);margin-right:.9rem}
.wnow .t{font-size:3rem;font-weight:300;letter-spacing:-.04em;line-height:1}
.wnow .d{font-size:.95rem;margin-top:.25rem}
.wnow .d span{color:var(--mu);font-size:.82rem;margin-left:.3rem}
.wrow{display:flex;flex-wrap:wrap;margin-top:.8rem}
.pill{font-size:.8rem;padding:.3rem .65rem;border-radius:999px;background:var(--card2);margin:0 .35rem .35rem 0;white-space:nowrap}
.pill b{font-weight:600}
.g1{color:var(--ok)}.g2{color:var(--ac)}.g3{color:var(--warn)}.g4{color:var(--bad)}
.hours{display:flex;justify-content:space-between;margin-top:auto;padding-top:.7rem;border-top:1px solid var(--line)}
.hours div{text-align:center;font-size:.78rem;color:var(--mu);flex:1}
.hours .i{width:1.6em;height:1.6em;display:block;margin:.3rem auto;color:var(--tx)}
.hours b{display:block;color:var(--tx);font-size:.92rem;font-weight:500}
.hours small{display:block;color:var(--ac);font-size:.7rem;height:1em}
/* 버스 */
.bus{overflow-y:auto}
.busg{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));grid-gap:.55rem 1rem}
.stop{min-width:0}
.stop h3{font-size:.82rem;font-weight:600;color:var(--mu);margin-bottom:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br{display:flex;align-items:center;padding:.15rem 0;font-size:.9rem}
.br .rt{min-width:3.6rem;font-weight:700;padding:.12rem .45rem;border-radius:8px;background:var(--card2);text-align:center;margin-right:.6rem;font-size:.8rem}
.br .a{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .a small{color:var(--mu);margin-left:.4rem}
.soon{color:var(--kid);font-weight:600}
/* 캘린더 */
.cal{display:flex;flex-direction:column}
.legend{display:flex;margin-right:.6rem}
.legend span{font-size:.75rem;color:var(--mu);margin-left:.7rem;display:flex;align-items:center}
.legend i{width:.55rem;height:.55rem;border-radius:50%;margin-right:.3rem;display:inline-block}
.addbtn{background:var(--ac);color:#fff;border-radius:999px;padding:.4rem .85rem;font-size:.85rem;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:.5rem}
.wd{text-align:center;padding:.4rem 0 .35rem;border-radius:14px}
.wd small{display:block;font-size:.72rem;color:var(--mu)}
.wd b{display:block;font-size:1.2rem;font-weight:600;margin:.1rem 0}
.wd.sun b,.wd.hol b{color:var(--hol)}.wd.sat b{color:var(--ac)}
.wd.on{background:var(--ac)}.wd.on b,.wd.on small{color:#fff}
.dots{height:.45rem;display:flex;justify-content:center}
.dots i{width:.38rem;height:.38rem;border-radius:50%;margin:0 .08rem}
.evlist{flex:1;overflow-y:auto;margin:0 -.3rem;padding:0 .3rem}
.day h3{font-size:.8rem;font-weight:600;color:var(--mu);margin:.8rem 0 .35rem}
.day:first-child h3{margin-top:.2rem}
.ev{display:flex;align-items:center;padding:.6rem .7rem;border-radius:13px;background:var(--card2);margin-bottom:.38rem}
.ev .bar{width:4px;align-self:stretch;border-radius:4px;margin-right:.75rem}
.ev .et{width:4.7rem;flex:0 0 auto;color:var(--mu);font-size:.82rem;font-variant-numeric:tabular-nums;line-height:1.25}
.ev .tt{flex:1;min-width:0;font-size:1rem;line-height:1.3}
.ev .tt small{display:block;font-size:.75rem;color:var(--mu)}
.ev.past{opacity:.42}
.ev.now{box-shadow:inset 0 0 0 1.5px var(--ac)}
.empty{color:var(--mu);font-size:.9rem;padding:.7rem}
/* 사진 */
.photo{padding:0;background:#000}
.photo img,#frame img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
.photo img.on,#frame img.on{opacity:1}
.phcap{position:absolute;left:.8rem;bottom:.6rem;font-size:.75rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.phempty{position:absolute;top:50%;left:0;right:0;text-align:center;color:#777;font-size:.85rem;transform:translateY(-50%)}
/* 가족 톡 */
.memo{display:flex;flex-direction:column}
.status{display:flex;flex-wrap:wrap;margin-bottom:.3rem}
.st{display:flex;align-items:center;padding:.32rem .7rem;border-radius:999px;background:var(--card2);font-size:.82rem;margin:0 .35rem .35rem 0}
.st b{margin-right:.35rem;font-weight:600}
.st small{color:var(--mu);margin-left:.35rem;font-size:.72rem}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:.2rem 0}
.m{max-width:84%;margin:.25rem 0;display:flex;flex-direction:column;align-items:flex-start}
.m .who{font-size:.72rem;color:var(--mu);margin:0 .4rem .15rem}
.m .b{background:var(--card2);padding:.5rem .8rem;border-radius:17px 17px 17px 5px;font-size:.97rem;line-height:1.4;word-break:break-all}
.m .b em{font-style:normal;font-size:1.25rem;margin-right:.25rem;vertical-align:-.1em}
.m.me{align-self:flex-end;align-items:flex-end}
.m.me .b{background:var(--ac);color:#fff;border-radius:17px 17px 5px 17px}
.chips{display:flex;overflow-x:auto;white-space:nowrap;padding:.4rem 0 .45rem;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;margin-right:.4rem;padding:.38rem .75rem;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:.84rem}
.comp{display:flex;align-items:center}
.comp .who{padding:.55rem .7rem;border-radius:12px;background:var(--card2);font-size:.85rem;font-weight:600;margin-right:.35rem;white-space:nowrap}
.comp .mood{font-size:1.3rem;padding:.3rem .45rem;border-radius:12px;background:var(--card2);margin-right:.35rem;min-width:2.5rem}
.comp input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:.6rem .7rem;font-size:.95rem;outline:none}
.comp .send{margin-left:.35rem;background:var(--ac);color:#fff;border-radius:12px;padding:.55rem .7rem}
.moods{display:flex;flex-wrap:wrap;padding-top:.4rem}
.moods button{font-size:1.45rem;padding:.2rem .35rem}
.flash{animation:fl 1.5s 2}
@keyframes fl{50%{box-shadow:inset 0 0 0 2px var(--kid)}}
/* 하단 바 */
.dock{position:absolute;left:0;right:0;bottom:0;height:3.7rem;display:flex;align-items:center;padding:0 .75rem;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.dk{flex:0 0 auto}
.dk{display:flex;align-items:center;padding:.55rem .9rem;border-radius:999px;font-size:.9rem;color:var(--mu);margin-right:.3rem}
.dk .i{margin-right:.4rem}
.dk.main{background:var(--ac);color:#fff;font-weight:600;padding:.6rem 1.2rem;margin-right:.6rem}
.dk.playing{color:var(--kid)}
.sp{flex:1}
/* 모달 */
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.modal.open{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;width:92%;max-width:36rem;max-height:92%;overflow-y:auto;padding:1.3rem 1.4rem}
.box h2{font-size:1.15rem;margin-bottom:1rem}
.f{margin-bottom:.75rem}
.f label{display:block;font-size:.78rem;color:var(--mu);margin-bottom:.3rem;white-space:pre-line}
.f input,.f select,.f textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:.65rem .8rem;font-size:.98rem;outline:none}
.f textarea{min-height:5.5rem;resize:vertical;line-height:1.45}
.f.ck label{display:flex;align-items:center;color:var(--tx);font-size:.92rem}
.f.ck input{width:auto;margin-right:.5rem;transform:scale(1.3)}
.row2{display:flex}.row2>.f{flex:1}.row2>.f+.f{margin-left:.6rem}
.sec{font-size:.78rem;font-weight:700;color:var(--ac);margin:1.2rem 0 .6rem;letter-spacing:.05em}
.btns{display:flex;justify-content:flex-end;margin-top:1rem}
.btn{border-radius:12px;padding:.65rem 1.15rem;font-size:.95rem;background:var(--card2);margin-left:.5rem}
.btn.pri{background:var(--ac);color:#fff;font-weight:600}
.btn.danger{color:var(--bad);margin-left:0;margin-right:auto}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{flex:1;white-space:nowrap;padding:.55rem .8rem;border-radius:10px;font-size:.92rem;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.list button{display:block;width:100%;text-align:left;padding:.8rem .9rem;border-radius:12px;background:var(--card2);margin-bottom:.4rem;font-size:1rem}
.list button.on{background:var(--ac);color:#fff}
.foot{font-size:.75rem;color:var(--mu);margin-top:1rem;text-align:center}
.foot a{color:var(--ac)}
/* 도우미 */
.bot .face{width:4.4rem;height:4.4rem;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto .5rem}
.bot .face.think{animation:pu 1s infinite}
@keyframes pu{50%{transform:scale(.9);opacity:.7}}
.blog{max-height:16rem;overflow-y:auto;display:flex;flex-direction:column;margin:.6rem 0}
.blog .m .b{font-size:1.08rem}
.blog .m.bot .b{background:var(--card2)}
.qs{display:flex;flex-wrap:wrap;margin:.4rem 0}
.qs .chip{margin:0 .4rem .4rem 0;font-size:.92rem;padding:.5rem .85rem}
/* 넓은 창: 유튜브 · 뉴스 · 주식 */
.box.wide{max-width:62rem;width:95%}
.box .top{display:flex;align-items:center;margin-bottom:.8rem}
.box .top h2{flex:1;margin:0}
.yth{font-size:.85rem;font-weight:700;margin:1rem 0 .5rem;color:var(--mu)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));grid-gap:.7rem}
.vid{text-align:left;border-radius:12px;overflow:hidden;background:var(--card2)}
.vid .th{position:relative;padding-top:56.25%;background:#000}
.vid .th img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.vid .vt{padding:.45rem .6rem .55rem;font-size:.85rem;line-height:1.35;height:3.3em;overflow:hidden}
.vid .vt small{display:block;color:var(--mu);font-size:.72rem}
.player{position:relative;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden}
.player iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
.news a{display:block;padding:.7rem .2rem;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:1rem;line-height:1.4}
.news a small{display:block;color:var(--mu);font-size:.75rem;margin-top:.15rem}
.sum{background:var(--card2);border-radius:12px;padding:.8rem 1rem;margin-bottom:.6rem;line-height:1.55;font-size:.98rem;white-space:pre-line}
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));grid-gap:.7rem}
.stk{background:var(--card2);border-radius:14px;padding:.8rem .9rem .5rem}
.stk .sn{font-size:.85rem;color:var(--mu)}
.stk .sp{font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;margin:.1rem 0}
.stk .sc{font-size:.85rem;font-weight:600}
.up{color:#ff5a5f}.dn{color:#4c8dff}
.stk svg{width:100%;height:3.6rem;display:block;margin-top:.3rem}
/* 액자 · 밤 */
#frame{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:40;display:none}
#frame img{object-fit:contain}
#frame .fc{position:absolute;left:2rem;bottom:1.6rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8)}

(function(){

/* 아이콘 */
var IP={

  rain:'<path d="M7 15h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 6a4.5 4.5 0 0 0 0 9z"/><path d="M8.5 18l-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/>',
  snow:'<path d="M7 15h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 6a4.5 4.5 0 0 0 0 9z"/><path d="M8 18.5h.01M12 20.5h.01M16 18.5h.01M10 21.5h.01M14 21.5h.01" stroke-width="2.4"/>',

  radio:'<rect x="3" y="8" width="18" height="12" rx="2.5"/><path d="M7 8l10-4"/><circle cx="15.5" cy="14" r="2.5"/><path d="M6.5 12.5h3.5M6.5 15.5h3.5"/>',
  photo:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  power:'<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>',
  refresh:'<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>',
  send:'<path d="M4 12l16-8-6 16-2.5-6.5z"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  yt:'<rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.2v5.6l4.8-2.8z"/>',
  news:'<path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M7.5 9h6M7.5 12.5h6M7.5 16h4"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01" stroke-width="2.4"/>',
  bus:'<rect x="4.5" y="3" width="15" height="15" rx="3"/><path d="M4.5 11h15M8 18v3M16 18v3"/><path d="M8 14.5h.01M16 14.5h.01" stroke-width="2.4"/>'
};
function ic(n,cls){return '<svg class="i '+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(IP[n]||'')+'</svg>'}

/* 토스트 */
var tT;function toast(t){var el=$('#toast');el.textContent=t;el.className='on';clearTimeout(tT);tT=setTimeout(function(){el.className=''},2600)}

/* ───────── 서버 호출 ───────── */
function api(action,data){
  if(!S.api) return Promise.reject(new Error('설정에서 Apps Script 주소를 넣어주세요'));
  var body=Object.assign({action:action,token:S.token},data||{});
  return fetch(S.api,{method:'POST',body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.text()})
    .then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw new Error('서버 응답 오류 (배포 설정·주소 확인)')}if(!j.ok)throw new Error(j.error||'오류');return j.data});
}

/* ───────── 시계 · 테마 ───────── */
function fmtT(ms){var d=new Date(ms),h=d.getHours();return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+pad(d.getMinutes())}
function tickClock(){
  var d=new Date(),h=d.getHours(),m=pad(d.getMinutes());
  $('#time').textContent=(h%12||12)+':'+m;
  $('#ampm').textContent=h<12?'오전':'오후';
  $('#date').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYS[d.getDay()]+'요일';
  var g=h<5?'깊은 밤이에요, 푹 자요 🌙':h<11?'좋은 아침이에요 ☀️':h<14?'맛있는 점심 먹어요 🍚':h<18?'즐거운 오후예요 🌤️':h<21?'오늘 하루 수고했어요 🌆':'편안한 밤 보내요 🌙';
  $('#greet').textContent=g;
  $('#fTime').textContent=(h<12?'오전 ':'오후 ')+(h%12||12)+':'+m;
  $('#fDate').textContent=$('#date').textContent;
  $('#nClock').textContent=(h%12||12)+':'+m;
  var th=S.theme==='auto'?(h>=7&&h<19?'light':'dark'):S.theme;
  if(document.documentElement.getAttribute('data-theme')!==th) document.documentElement.setAttribute('data-theme',th);
}

/* ───────── 날씨 (Open-Meteo, 키 없음) ───────── */
var WX=null,AIR=null;
var WMO={0:['맑음','sun'],1:['대체로 맑음','sun'],2:['구름 조금','pcloud'],3:['흐림','cloud'],45:['안개','fog'],48:['안개','fog'],
51:['이슬비','rain'],53:['이슬비','rain'],55:['이슬비','rain'],56:['어는 비','rain'],57:['어는 비','rain'],61:['비','rain'],63:['비','rain'],65:['강한 비','rain'],
66:['어는 비','rain'],67:['어는 비','rain'],71:['눈','snow'],73:['눈','snow'],75:['많은 눈','snow'],77:['싸락눈','snow'],80:['소나기','rain'],81:['소나기','rain'],
82:['강한 소나기','rain'],85:['눈','snow'],86:['많은 눈','snow'],95:['뇌우','storm'],96:['우박','storm'],99:['우박','storm']};
function wInfo(c,day){var w=WMO[c]||['-','cloud'];var k=w[1];if(day===0&&k==='sun')k='moon';return {t:w[0],k:k}}
function pmG(v,small){if(v==null)return['-',''];var a=small?[15,35,75]:[30,80,150];return v<=a[0]?['좋음','g1']:v<=a[1]?['보통','g2']:v<=a[2]?['나쁨','g3']:['매우나쁨','g4']}
function loadWeather(){
  var q='latitude='+S.lat+'&longitude='+S.lon+'&timezone=Asia%2FSeoul';
  var u='https://api.open-meteo.com/v1/forecast?'+q+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day'+
    '&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&forecast_days=2&wind_speed_unit=ms';
  var a='https://air-quality-api.open-meteo.com/v1/air-quality?'+q+'&current=pm10,pm2_5';
  return Promise.all([
    fetch(u).then(function(r){return r.json()}),
    fetch(a).then(function(r){return r.json()}).catch(function(){return null})
  ]).then(function(res){WX=res[0];AIR=res[1];renderWeather()})
  .catch(function(){$('#weather').innerHTML='<div class="hd"><h2>날씨</h2></div><div class="err">날씨 정보를 가져오지 못했어요</div>'});
}
function renderWeather(){
  if(!WX||!WX.current) return;
  var c=WX.current,dd=WX.daily,w=wInfo(c.weather_code,c.is_day);
  var p10=AIR&&AIR.current?Math.round(AIR.current.pm10):null,p25=AIR&&AIR.current?Math.round(AIR.current.pm2_5):null;
  var g10=pmG(p10),g25=pmG(p25,true);
  var h='<div class="hd"><h2>'+esc(S.place)+' 날씨</h2></div>';
  h+='<div class="wnow">'+ic(w.k,'big')+'<div><div class="t">'+Math.round(c.temperature_2m)+'°</div><div class="d">'+w.t+'<span>체감 '+Math.round(c.apparent_temperature)+'°</span></div></div></div>';
  h+='<div class="wrow"><span class="pill">최고 <b>'+Math.round(dd.temperature_2m_max[0])+'°</b> · 최저 <b>'+Math.round(dd.temperature_2m_min[0])+'°</b></span>';
  h+='<span class="pill">강수 <b>'+(dd.precipitation_probability_max[0]||0)+'%</b></span>';
  h+='<span class="pill">습도 '+c.relative_humidity_2m+'% · 바람 '+Math.round(c.wind_speed_10m)+'m/s</span>';
  if(p10!=null) h+='<span class="pill">미세 <b class="'+g10[1]+'">'+g10[0]+'</b> · 초미세 <b class="'+g25[1]+'">'+g25[0]+'</b></span>';
  var tw=wInfo(dd.weather_code[1],1);
  h+='<span class="pill mu">내일 '+tw.t+' '+Math.round(dd.temperature_2m_min[1])+'°/'+Math.round(dd.temperature_2m_max[1])+'°</span></div>';
  // 시간별 (3시간 간격 6칸)
  var now=Date.now(),hr=WX.hourly,start=0;
  for(var i=0;i<hr.time.length;i++){if(new Date(hr.time[i]).getTime()>now){start=i;break}}
  h+='<div class="hours">';
  for(var k=0;k<6;k++){var j=start+k*3;if(j>=hr.time.length)break;var t=new Date(hr.time[j]),hh=t.getHours(),wi=wInfo(hr.weather_code[j],hr.is_day[j]),pp=hr.precipitation_probability[j];
    h+='<div>'+(hh<12?'오전':'오후')+' '+(hh%12||12)+'시'+ic(wi.k)+'<b>'+Math.round(hr.temperature_2m[j])+'°</b><small>'+(pp>=30?'☂ '+pp+'%':'')+'</small></div>'}
  h+='</div>';
  $('#weather').innerHTML=h;
}
function weatherText(){
  if(!WX||!WX.current) return '날씨 정보 없음';
  var c=WX.current,dd=WX.daily,w=wInfo(c.weather_code,1);
  var s=S.place+' 현재 '+Math.round(c.temperature_2m)+'도(체감 '+Math.round(c.apparent_temperature)+'도), '+w.t+', 오늘 최고 '+Math.round(dd.temperature_2m_max[0])+'도 최저 '+Math.round(dd.temperature_2m_min[0])+'도, 강수확률 '+(dd.precipitation_probability_max[0]||0)+'%';
  if(AIR&&AIR.current) s+=', 미세먼지 '+pmG(AIR.current.pm10)[0]+', 초미세먼지 '+pmG(AIR.current.pm2_5,true)[0];
  s+='. 내일은 '+wInfo(dd.weather_code[1],1).t+', '+Math.round(dd.temperature_2m_min[1])+'~'+Math.round(dd.temperature_2m_max[1])+'도.';
  return s;
}

/* ───────── 캘린더 ───────── */
var EV=[],CALS=[],selDay=null;
var CC={family:'var(--fam)',child:'var(--kid)',holiday:'var(--hol)'};
function dayKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
function calName(k){for(var i=0;i<CALS.length;i++)if(CALS[i].key===k)return CALS[i].name;return k}
function loadEvents(){
  return api('events',{days:14}).then(function(r){EV=r.events;CALS=r.cals;DONE=r.done||{};renderCal();renderTodo()})
  .catch(function(e){$('#evlist').innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
}
function buildDays(){
  var today=sod(new Date()),days=[],map={};
  for(var i=0;i<14;i++){var d=new Date(today);d.setDate(d.getDate()+i);var o={d:d,key:dayKey(d),ev:[],hol:false};days.push(o);map[o.key]=o}
  EV.forEach(function(e){
    if(isTodo(e))return;
    if(e.allDay){
      for(var d=new Date(Math.max(e.start,today.getTime()));d.getTime()<e.end;d.setDate(d.getDate()+1)){var g=map[dayKey(d)];if(g){g.ev.push(e);if(e.cal==='holiday')g.hol=true}}
    }else{
      var g=map[dayKey(new Date(e.start))];
      if(g)g.ev.push(e);else if(e.start<today.getTime()&&e.end>today.getTime())days[0].ev.push(e);
    }
  });
  days.forEach(function(x){x.ev.sort(function(a,b){return (b.allDay-a.allDay)||(a.start-b.start)})});
  return days;
}
function renderCal(){
  var days=buildDays(),now=Date.now();

/* ───────── 오늘 할 일 (구글 캘린더 일정 중 제목이 "할일:"로 시작하는 것) ───────── */
var DONE={},REM={shown:{}};
function tdRe(){var ps=String(S.todoPrefix||'할일').split(',').map(function(x){return x.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).filter(Boolean);
  ps.push('☐','□','✅','✔');return new RegExp('^\\s*[\\[(【]?\\s*(?:'+ps.join('|')+')\\s*[\\])】]?\\s*[:：\\-·]?\\s*','i')}
function isTodo(e){return e.cal!=='holiday'&&tdRe().test(e.title||'')}
function tdKey(e,day){return e.id+'|'+day}
function todayTodos(){
  var today=sod(new Date()),tk=dayKey(today),t0=today.getTime(),t1=t0+86400000,now=Date.now(),re=tdRe(),out=[];
  EV.forEach(function(e){
    if(!isTodo(e))return;
    if(e.allDay?!(e.start<t1&&e.end>t0):!(e.start>=t0&&e.start<t1))return;
    var k=tdKey(e,tk);
    out.push({e:e,key:k,title:(e.title||'').replace(re,'')||'할 일',allDay:e.allDay,start:e.start,done:!!DONE[k],
      soon:!e.allDay&&e.start-now<=15*60000&&e.start-now>-30*60000,late:!e.allDay&&now-e.start>30*60000});
  });
  out.sort(function(a,b){return (a.done-b.done)||((a.allDay?1:0)-(b.allDay?1:0))||(a.start-b.start)});
  return out;
}
function renderTodo(){
  var kid=members()[2]||S.me||'',list=todayTodos(),n=list.length,d=list.filter(function(x){return x.done}).length;
  $('#tdTitle').textContent=(kid?kid+' ':'')+'오늘 할 일'+(n?'  '+d+'/'+n:'');
  $('#tdProg').style.width=(n?Math.round(d/n*100):0)+'%';
  var h='';
  if(!n)h='<div class="empty">오늘 할 일이 없어요<br><small class="mu">+ 할 일 로 추가하거나, 구글 캘린더에 "할일: 숙제"처럼 일정을 만들면 여기에 나와요</small></div>';
  else if(d===n)h='<div class="alldone">🎉 오늘 할 일을 다 했어요! 최고야!</div>';
  list.forEach(function(t){
    h+='<button class="td'+(t.done?' done':'')+(!t.done&&t.soon?' soon':'')+(!t.done&&t.late?' late':'')+'" data-k="'+esc(t.key)+'"><span class="bx">'+(t.done?'✓':'')+'</span><span class="tx">'+esc(t.title)+
      (t.allDay?'':'<small>'+fmtT(t.start)+(!t.done&&t.late?' · 시간이 지났어요':'')+'</small>')+'</span></button>'});
  $('#tdList').innerHTML=h;
  $('#todo').classList.toggle('urgent',list.some(function(t){return !t.done&&t.soon}));
  var left=list.filter(function(t){return !t.done}),ft=$('#fTodo');
  if(left.length){ft.style.display='';ft.innerHTML='<b>오늘 할 일 '+left.length+'개 남았어요</b>'+left.slice(0,4).map(function(t){return '☐ '+esc(t.title)}).join('<br>')}else ft.style.display='none';
}
function setTodo(key,done){

  api('todoDone',{key:key,done:done}).then(function(m){DONE=m;renderTodo()}).catch(function(e){toast(e.message)});
}

/* ───────── 한 달 달력 (여러 날 일정은 막대로) ───────── */
var MON={y:0,m:0,ev:[]};
function openMonth(y,m){
  var now=new Date();if(y==null){y=now.getFullYear();m=now.getMonth()}
  if(m<0){m=11;y--}if(m>11){m=0;y++}
  MON.y=y;MON.m=m;
  var first=new Date(y,m,1),gs=new Date(y,m,1-first.getDay());
  openModal('<div class="mhd"><h2>'+y+'년 '+(m+1)+'월</h2><button class="btn" id="mPrev">‹ 이전</button><button class="btn" id="mToday">오늘</button><button class="btn" id="mNext">다음 ›</button><button class="btn" data-close>닫기</button></div><div id="mBody"><div class="empty">불러오는 중…</div></div>',true);
  $('#box').classList.add('full');
  $('#mPrev').onclick=function(){openMonth(y,m-1)};$('#mNext').onclick=function(){openMonth(y,m+1)};$('#mToday').onclick=function(){openMonth()};
  api('events',{start:gs.getTime(),days:42}).then(function(r){if(MON.y!==y||MON.m!==m)return;MON.ev=r.events.filter(function(e){return !isTodo(e)});if(!CALS.length)CALS=r.cals;renderMonth(gs)})
  .catch(function(e){var b=$('#mBody');if(b)b.innerHTML='<div class="err">'+esc(e.message)+'</div>'});
}
function renderMonth(gs){
  var b=$('#mBody');if(!b)return;
  var LANES=window.innerWidth<640?3:4,LH=1.3,tk=dayKey(new Date());
  var h='<div class="mdow">'+DAYS.map(function(d){return '<span>'+d+'</span>'}).join('')+'</div><div class="mgrid">';
  for(var w=0;w<6;w++){
    var ws=new Date(gs);ws.setDate(gs.getDate()+w*7);var we=new Date(ws);we.setDate(ws.getDate()+7);
    var wsT=ws.getTime(),weT=we.getTime(),hol={};
    // 이 주에 걸친 일정 → 시작칸·길이
    var segs=[];
    MON.ev.forEach(function(e){
      var s0=e.allDay?e.start:sod(new Date(e.start)).getTime(),e0=e.allDay?e.end:sod(new Date(e.end-1)).getTime()+86400000;
      if(e0<=wsT||s0>=weT)return;
      var a=Math.max(0,Math.round((Math.max(s0,wsT)-wsT)/86400000)),z=Math.min(7,Math.round((Math.min(e0,weT)-wsT)/86400000));
      if(z<=a)z=a+1;
      if(e.cal==='holiday'){for(var q=a;q<z;q++)hol[q]=1}
      segs.push({e:e,a:a,len:z-a,multi:(e0-s0)>86400000,cl:s0<wsT,cr:e0>weT});
    });
    segs.sort(function(x,y){return (y.multi-x.multi)||(y.len-x.len)||(x.a-y.a)||((x.e.allDay?0:1)-(y.e.allDay?0:1))||(x.e.start-y.e.start)});
    var lanes=[],bars='',more=[0,0,0,0,0,0,0];
    segs.forEach(function(sg){
      var L=-1;for(var i=0;i<LANES;i++){var ok=true;for(var c=sg.a;c<sg.a+sg.len;c++)if(lanes[i]&&lanes[i][c]){ok=false;break}if(ok){L=i;break}}
      if(L<0){for(var c2=sg.a;c2<sg.a+sg.len;c2++)more[c2]++;return}
      lanes[L]=lanes[L]||{};for(var c3=sg.a;c3<sg.a+sg.len;c3++)lanes[L][c3]=1;
      var e=sg.e,col=CC[e.cal]||'var(--ac)',bar=e.allDay||sg.multi;
      var label=(e.cal==='holiday'?'🎌 ':'')+(bar?'':fmtT(e.start).replace('오전 ','').replace('오후 ','')+' ')+e.title;
      bars+='<div class="mbar'+(bar?'':' t')+(sg.cl?' cl':'')+(sg.cr?' cr':'')+'" data-id="'+esc(e.id)+'" data-s="'+e.start+'" style="left:calc('+(sg.a/7*100)+'% + 2px);width:calc('+(sg.len/7*100)+'% - 4px);top:'+(L*LH)+'rem;background:'+col+'">'+(bar?'':'<i style="background:'+col+'"></i>')+esc(label)+'</div>';
    });
    more.forEach(function(n,c){if(n)bars+='<div class="mmore" style="left:calc('+(c/7*100)+'% + 6px);top:'+(LANES*LH)+'rem">+'+n+'개 더</div>'});
    h+='<div class="mwk">';
    for(var d=0;d<7;d++){var dd=new Date(ws);dd.setDate(ws.getDate()+d);var k=dayKey(dd),dw=dd.getDay();
      h+='<button class="mday'+(dd.getMonth()!==MON.m?' out':'')+(dw===0?' sun':dw===6?' sat':'')+(hol[d]?' hol':'')+(k===tk?' today':'')+'" data-k="'+k+'"><b>'+dd.getDate()+'</b></button>'}
    h+='<div class="mbars">'+bars+'</div></div>';
  }
  b.innerHTML=h+'</div><div class="foot">날짜를 누르면 그날 일정을 추가해요 · 막대를 누르면 수정해요</div>';
  b.onclick=function(ev){
    var bar=ev.target.closest('.mbar');
    if(bar){var id=bar.getAttribute('data-id'),st=bar.getAttribute('data-s'),e=null;MON.ev.forEach(function(x){if(x.id===id&&String(x.start)===st)e=x});if(e)openEvent(e);return}
    var dy=ev.target.closest('.mday');if(dy)openEvent(null,dy.getAttribute('data-k'));
  };
}

function renderMemos(isNew){

var PH={ids:[],order:[],i:-1,timer:null,busy:false,last:0};
function loadPhotoList(){
  var em=$('#photo .phempty');

function buildOrder(){var o=PH.ids.slice();if(S.photoOrder==='random'){for(var i=o.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=o[i];o[i]=o[j];o[j]=t}}PH.order=o;PH.i=PH.i<0?-1:PH.i%Math.max(o.length,1)}
/* 사진 캐시: 한 번 받은 사진은 기기에 저장해 두고 다시 쓰기 */
var PC={ok:('caches' in window)&&window.isSecureContext!==false,name:'fb-photos-v1',idx:{},urls:[]};
try{PC.idx=JSON.parse(localStorage.getItem('fb_phc')||'{}')}catch(e){PC.idx={}}
function pcSave(){try{localStorage.setItem('fb_phc',JSON.stringify(PC.idx))}catch(e){}}
function pcKey(id){return 'https://familyboard.cache/photo/'+encodeURIComponent(id)}
function pcCount(){return Object.keys(PC.idx).length}
function pcGet(id){
  if(!PC.ok||!PC.idx[id])return Promise.resolve(null);
  return caches.open(PC.name).then(function(c){return c.match(pcKey(id))}).then(function(r){
    if(!r){delete PC.idx[id];pcSave();return null}
    PC.idx[id].u=Date.now();pcSave();
    return r.blob().then(function(b){return {blob:b,w:PC.idx[id].w,cap:PC.idx[id].c||''}});
  }).catch(function(){return null});
}
function pcPut(id,blob,w,cap){
  if(!PC.ok)return;
  var max=Math.max(0,parseInt(S.photoCacheN,10)||0);if(!max)return;
  caches.open(PC.name).then(function(c){
    return c.put(pcKey(id),new Response(blob,{headers:{'Content-Type':blob.type||'image/jpeg'}})).then(function(){
      PC.idx[id]={w:w,c:cap,u:Date.now()};
      var ks=Object.keys(PC.idx);
      if(ks.length>max){ks.sort(function(x,y){return PC.idx[x].u-PC.idx[y].u});
        ks.slice(0,ks.length-max).forEach(function(k){delete PC.idx[k];c.delete(pcKey(k))})}
      pcSave();
    });
  }).catch(function(){});
}
function pcClear(){PC.idx={};pcSave();if(PC.ok)return caches.delete(PC.name).catch(function(){});return Promise.resolve()}
function netType(){var c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;return c&&c.type?c.type:'unknown'}
function canDownload(){
  if(S.photoNet==='never')return false;
  if(S.photoNet==='wifi'){var t=netType();return t!=='cellular'}
  return true;
}
function b64blob(b64,mime){var bin=atob(b64),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime||'image/jpeg'})}
function capOf(t){var m=String(t||'').match(/^(\d{4})[:\-](\d{2})[:\-](\d{2})/);return m?m[1]+'. '+(+m[2])+'. '+(+m[3]):''}
function showBlob(blob,cap){
  var url=URL.createObjectURL(blob),im=new Image();
  im.onload=function(){swap('#photo',url);swap('#frame',url);$('#photo .phcap').textContent=cap;
    PC.urls.push(url);while(PC.urls.length>3)URL.revokeObjectURL(PC.urls.shift());PH.busy=false};
  im.onerror=function(){URL.revokeObjectURL(url);PH.busy=false};
  im.src=url;
}
function nextPhoto(){
  clearTimeout(PH.timer);
  var sec=Math.max(5,parseInt(S.photoSec,10)||20);
  PH.timer=setTimeout(nextPhoto,sec*1000);
  if(!PH.order.length||PH.busy||asleep()||document.hidden)return;
  PH.i++;if(PH.i>=PH.order.length){PH.i=0;if(S.photoOrder==='random')buildOrder()}
  PH.busy=true;
  var big=$('#frame').style.display==='block',id=PH.order[PH.i],w=photoW(big),dl=canDownload();
  pcGet(id).then(function(hit){
    // 저장된 사진이 있고 화질이 충분하면(또는 지금 받을 수 없으면) 그대로 사용 → 데이터 0
    if(hit&&(hit.w>=w*0.7||!dl)){showBlob(hit.blob,hit.cap);return}
    if(!dl){ // 와이파이가 아니면 저장된 사진 중에서 돌려 보기
      var ks=Object.keys(PC.idx);
      if(!ks.length){PH.busy=false;return}
      var k=ks[Math.floor(Math.random()*ks.length)];
      return pcGet(k).then(function(h){if(h)showBlob(h.blob,h.cap);else PH.busy=false});
    }
    return api('photo',{id:id,w:w}).then(function(p){
      var blob=b64blob(p.b64,p.mime),cap=capOf(p.time);
      pcPut(id,blob,w,cap);showBlob(blob,cap);

  }).catch(function(){PH.busy=false});
}

  var cap=S.photoQ==='save'?720:S.photoQ==='high'?1920:(big?1600:1280);

function parseStops(){return lines(S.stops).map(function(l){var p=l.split('|').map(function(x){return x.trim()});if(p.length<2)return null;
  var t=p[0].toLowerCase(),type,id,name,routes;
  if(t==='seoul'||t==='서울'||t==='gg'||t==='경기'){type=(t==='gg'||t==='경기')?'gg':'seoul';id=p[1];name=p[2]||p[1];routes=p[3]||''}
  else{ // "노선|정류장번호|이름" 처럼 노선을 앞에 쓴 경우도 이해하기
    var ni=/^\d{5,9}$/.test(p[1])?1:(/^\d{5,9}$/.test(p[0])?0:1);id=p[ni];
    routes=ni===1?p[0]:(p[3]||'');name=p[2]||id;type=id.length>5?'gg':'seoul'}
  return {type:type,id:id.replace(/\D/g,''),name:name,filter:routes.split(',').map(function(x){return x.trim()}).filter(Boolean)}}).filter(Boolean)}
function routeNorm(x){return String(x||'').replace(/\s|번/g,'').replace(/대$/,'').toUpperCase()}
function routeOk(s,r){if(!s.filter.length)return true;var a=routeNorm(r);
  return s.filter.some(function(f){return routeNorm(f)===a})}
/* 버스 갱신 시간대: "시작-끝|초" — 이 시간에만 자동 갱신 (공공데이터 하루 호출 한도 절약) */
function busWin(){
  var d=new Date(),t=d.getHours()*60+d.getMinutes(),hit=null;
  lines(S.busTimes).forEach(function(l){var m=l.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})(?:\s*\|\s*(\d+))?/);if(!m)return;
    var a=+m[1]*60+ +m[2],b=+m[3]*60+ +m[4];if(a<=b?(t>=a&&t<b):(t>=a||t<b))hit={sec:Math.max(30,+(m[5]||60))}});
  return hit;
}
function busNext(){
  var d=new Date(),t=d.getHours()*60+d.getMinutes(),best=null;
  lines(S.busTimes).forEach(function(l){var m=l.match(/^(\d{1,2}):(\d{2})/);if(!m)return;var a=+m[1]*60+ +m[2],diff=(a-t+1440)%1440;if(best===null||diff<best.diff)best={diff:diff,txt:m[1]+':'+m[2]}});
  return best?best.txt:'';
}

function spark(pts,prev,up){
  if(!pts||pts.length<2)return '';

  var base=prev!=null?'<line x1="0" x2="'+W+'" y1="'+(H-2-(prev-mn)/r*(H-4)).toFixed(1)+'" y2="'+(H-2-(prev-mn)/r*(H-4)).toFixed(1)+'" stroke="currentColor" stroke-dasharray="3 3" opacity=".3"/>':'';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="'+(up?'up':'dn')+'">'+base+'<path d="'+path+'" fill="none" stroke="currentColor" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>';

/* 음성 질문: 마이크로 녹음(WAV 16kHz) → Gemini가 듣고 대답 (브라우저 음성인식 없이 모든 기기에서 동작) */
var AC=window.AudioContext||window.webkitAudioContext;
var MIC_OK=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&AC);
var REC=null;
function micToggle(){if(REC){micStop(true);return}micStart()}
function micStart(){
  speechStop();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(stream){
    var ctx=new AC(),src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(4096,1,1),bufs=[],peak=0;
    proc.onaudioprocess=function(e){var d=e.inputBuffer.getChannelData(0);bufs.push(new Float32Array(d));for(var i=0;i<d.length;i+=64){var a=Math.abs(d[i]);if(a>peak)peak=a}};
    src.connect(proc);proc.connect(ctx.destination);
    REC={ctx:ctx,stream:stream,proc:proc,bufs:bufs,rate:ctx.sampleRate,peak:function(){return peak},t:setTimeout(function(){micStop(true)},8000)};
    var b=$('#bMic');if(b){b.style.background='var(--bad)';b.innerHTML='■'}
    var f=$('#bF');if(f){f.className='face think';f.textContent='👂'}
    toast('듣고 있어요… 다 말하면 ■ 를 누르세요');
  }).catch(function(e){
    var fully=!!window.fully||/fully/i.test(navigator.userAgent);
    toast(/NotAllowed|Permission|NotReadable|NotFound/i.test(e.name+e.message)?(fully?'마이크 권한이 없어요 · Fully 설정 › Web Content Settings › Enable Microphone Access 켜기 + 태블릿 설정 › 앱 › Fully › 권한 › 마이크 허용':'마이크 권한을 허용해 주세요 (주소창 왼쪽 자물쇠 › 권한 › 마이크)'):'마이크를 쓸 수 없어요: '+e.name);
  });
}
function micStop(send){
  var r=REC;if(!r)return;REC=null;clearTimeout(r.t);
  try{r.proc.disconnect();r.stream.getTracks().forEach(function(t){t.stop()});r.ctx.close()}catch(e){}
  var b=$('#bMic');if(b){b.style.background='var(--kid)';b.innerHTML=ic('mic')}
  var f=$('#bF');if(f){f.className='face';f.textContent='🐣'}
  if(!send)return;
  var n=0;r.bufs.forEach(function(x){n+=x.length});
  if(n<r.rate*0.5||r.peak()<0.02){toast('소리가 잘 안 들렸어요. 마이크 가까이에서 다시 말해 주세요');return}
  askVoice(wav16(r.bufs,n,r.rate));
}
function wav16(bufs,n,rate){
  var out=16000,ratio=rate/out,len=Math.floor(n/ratio),all=new Float32Array(n),o=0;
  bufs.forEach(function(x){all.set(x,o);o+=x.length});
  var dv=new DataView(new ArrayBuffer(44+len*2));
  function str(p,t){for(var i=0;i<t.length;i++)dv.setUint8(p+i,t.charCodeAt(i))}
  str(0,'RIFF');dv.setUint32(4,36+len*2,true);str(8,'WAVE');str(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,out,true);dv.setUint32(28,out*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);str(36,'data');dv.setUint32(40,len*2,true);
  for(var i=0;i<len;i++){var a=0,s0=Math.floor(i*ratio),s1=Math.min(n,Math.floor((i+1)*ratio)),c=0;for(var k=s0;k<s1;k++){a+=all[k];c++}
    var v=Math.max(-1,Math.min(1,c?a/c:0));dv.setInt16(44+i*2,v<0?v*0x8000:v*0x7FFF,true)}
  var u=new Uint8Array(dv.buffer),bin='';for(var j=0;j<u.length;j+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(j,j+0x8000));
  return btoa(bin);
}

}

  ['questions','도우미 빠른 질문 (한 줄에 하나)','area']
];
function openSettings(first){
  var h='<h2>설정</h2>'+(first?'<div class="empty" style="padding:0 0 .5rem">처음 오셨네요 👋 Apps Script 주소와 토큰부터 넣어주세요.</div>':'');
  FIELDS.forEach(function(f){
    if(f[0]==='#'){h+='<div class="sec">'+f[1]+'</div>';return}
    var v=S[f[0]],id='s_'+f[0];
    if(f[2]==='area')h+='<div class="f"><label>'+esc(f[1])+'</label><textarea id="'+id+'">'+esc(v)+'</textarea></div>';
    else if(f[2]==='select')h+='<div class="f"><label>'+esc(f[1])+'</label><select id="'+id+'">'+f[3].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===v?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>';
    else if(f[2]==='check')h+='<div class="f ck"><label><input type="checkbox" id="'+id+'"'+(v?' checked':'')+'>'+esc(f[1])+'</label></div>';
    else h+='<div class="f"><label>'+esc(f[1])+'</label><input type="'+(f[2]==='number'?'number':'text')+'" id="'+id+'" value="'+esc(v)+'" placeholder="'+esc(f[3]||'')+'"></div>';
    if(f[0]==='photoCacheN')h+='<div class="btns" style="margin:-.3rem 0 .6rem"><span class="mu" style="font-size:.8rem;margin-right:auto;align-self:center">저장된 사진 '+pcCount()+'장'+(PC.ok?'':' · 이 브라우저는 저장 불가')+' · 연결: '+netType()+'</span><button class="btn" id="sPC">저장된 사진 비우기</button></div>';
    if(f[0]==='place')h+='<div class="btns" style="margin:-.3rem 0 .6rem"><button class="btn" id="sGeo">지역 검색</button></div>';
  });
  h+='<div class="sec">화면 배치 (이 기기만)</div><div class="btns" style="justify-content:flex-start;margin-top:0"><button class="btn pri" style="margin-left:0" id="sLay">칸 옮기기·크기 바꾸기</button><button class="btn" id="sLayR">처음 배치로</button></div>';
  h+='<div class="sec">설정 옮기기</div><div class="f"><label>다른 기기(엄마·아빠 휴대폰)에 붙여넣으면 같은 설정이 됩니다</label><textarea id="sX"></textarea></div>'+
    '<div class="btns" style="margin-top:0"><button class="btn" id="sExp">설정 코드 만들기</button><button class="btn" id="sImp">코드 적용</button></div>';
  h+='<div class="btns"><button class="btn danger" id="sTest">연결 테스트</button><button class="btn" data-close>닫기</button><button class="btn pri" id="sSave">저장</button></div>';
  h+='<div class="foot">ArchiKHC FamilyBoard v'+VER+' · 만든이 김현철<br><a href="'+BLOG+'" target="_blank">'+BLOG.replace('https://','')+'</a></div>';
  openModal(h);
  function collect(){FIELDS.forEach(function(f){if(f[0]==='#')return;var el=$('#s_'+f[0]);S[f[0]]=f[2]==='check'?el.checked:el.value.trim()})}
  $('#sSave').onclick=function(){collect();saveS();closeModal();toast('저장했어요');cWho=S.me;renderCompose();renderMemos();buildOrder();applyMenus();applyScale();renderTodo();refreshAll(true)};
  $('#sTest').onclick=function(){collect();api('ping').then(function(r){alert('✅ 연결 성공\n서버: '+(r.ver||'예전 버전 (새로 배포 필요)')+'\n\n'+r.cals.map(function(c){return (c.ok?'✅ ':'❌ ')+c.name}).join('\n'))}).catch(function(e){alert('❌ '+e.message)})};
  $('#sPC').onclick=function(){pcClear().then(function(){toast('저장된 사진을 비웠어요');closeModal()})};
  $('#sGeo').onclick=function(){var n=$('#s_place').value.trim();if(!n)return;
    fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&language=ko&name='+encodeURIComponent(n)).then(function(r){return r.json()}).then(function(j){
      var r=(j.results||[]).filter(function(x){return x.country_code==='KR'})[0]||(j.results||[])[0];
      if(!r){toast('찾지 못했어요. 시·구 이름으로 검색해 보세요');return}
      $('#s_lat').value=r.latitude.toFixed(4);$('#s_lon').value=r.longitude.toFixed(4);toast(r.name+(r.admin1?' ('+r.admin1+')':'')+' 위치로 맞췄어요')}).catch(function(){toast('검색 실패')})};
  $('#sLay').onclick=function(){closeModal();editStart()};
  $('#sLayR').onclick=function(){layReset();closeModal();toast('처음 배치로 돌렸어요')};
  $('#sExp').onclick=function(){collect();var o=Object.assign({},S);delete o.me;$('#sX').value=btoa(unescape(encodeURIComponent(JSON.stringify(o))));$('#sX').select()};
  $('#sImp').onclick=function(){try{var o=JSON.parse(decodeURIComponent(escape(atob($('#sX').value.trim()))));var me=S.me;Object.assign(S,o);S.me=me;saveS();closeModal();toast('설정을 가져왔어요');setTimeout(function(){location.reload()},800)}catch(e){toast('코드가 올바르지 않아요')}};
}
// 설정은 길게 눌러야 열림 (아이가 실수로 못 바꾸게)
(function(){var b=$('#dSet'),t=null;
  function down(){t=setTimeout(function(){t=null;openSettings()},700)}
  function up(){if(t){clearTimeout(t);t=null;toast('설정은 길게 눌러주세요')}}
  b.addEventListener('touchstart',function(e){e.preventDefault();down()},{passive:false});b.addEventListener('touchend',up);
  b.addEventListener('mousedown',down);b.addEventListener('mouseup',up);
})();

/* ───────── 하단 바 ───────── */
$('#dBot').innerHTML=ic('chat')+'<span>'+esc(S.bot||'도우미')+'에게 물어보기</span>';
$('#dFrame').innerHTML=ic('photo')+'<span>액자</span>';
$('#dOff').innerHTML=ic('power')+'<span>화면 끄기</span>';
$('#dRef').innerHTML=ic('refresh')+'<span>새로고침</span>';
$('#dSet').innerHTML=ic('gear')+'<span>설정</span>';
$('#dMonth').innerHTML=ic('cal')+'<span>달력</span>';$('#dMonth').onclick=function(){openMonth()};
$('#dYt').innerHTML=ic('yt')+'<span>유튜브</span>';
$('#dNews').innerHTML=ic('news')+'<span>경제뉴스</span>';
$('#dStock').innerHTML=ic('chart')+'<span>증시</span>';
$('#dBot').onclick=openBot;$('#dRadio').onclick=openRadio;$('#dFrame').onclick=openFrame;
$('#dYt').onclick=openYt;$('#dNews').onclick=openNews;$('#dStock').onclick=function(){openStock('1d')};
function applyMenus(){$('#dRadio').style.display=S.menuRadio?'':'none';$('#dYt').style.display=S.menuYt?'':'none';$('#dNews').style.display=S.menuNews?'':'none';$('#dStock').style.display=S.menuStock?'':'none'}
applyMenus();
$('#dRef').onclick=function(){toast('새로 불러오는 중…');refreshAll(true)};

/* ───────── 스케줄러 ───────── */
var LAST={},lastTouch=Date.now(),reloaded=false;
function due(k,sec,force){if(force||!LAST[k]||Date.now()-LAST[k]>sec*1000){LAST[k]=Date.now();return true}return false}
function refreshAll(force){
  if(asleep()&&!force)return;
  if(due('ev',300,force))loadEvents();
  if(due('memo',30,force))loadMemos();
  if(due('wx',1200,force))loadWeather();
  var h=new Date().getHours();
  var bw=busWin();
  if(bw){if(due('bus',bw.sec,force))loadBus()}
  else if(busPinned()){if(due('bus',60,force))loadBus()}
  else if(force||LAST.busShown!==false)busIdle();
  if(due('ph',3600,force))loadPhotoList();
}
function tick(){
  tickClock();applyDim();renderTodo();checkRemind();
  if(!document.hidden)refreshAll(false);
  var idle=parseInt(S.idleFrame,10)||0;
  if(idle>0&&!asleep()&&PH.ids.length&&$('#frame').style.display!=='block'&&$('#modal').className.indexOf('open')<0&&Date.now()-lastTouch>idle*60000)openFrame();
  var d=new Date();
  if(d.getHours()===4&&d.getMinutes()<2&&!reloaded&&Date.now()-START>3600000){reloaded=true;location.reload()} // 하루 한 번 새로 고쳐 메모리 정리
  var day=dayKey(d);if(tick.day&&tick.day!==day){selDay=null;LAST.ev=0}tick.day=day;
}
var START=Date.now();
['touchstart','mousedown','keydown'].forEach(function(n){document.addEventListener(n,function(){lastTouch=Date.now()},true)});
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});

/* ───────── 화면 배치: 12칸 격자, 기기마다 따로 저장 ───────── */
var WN={clock:'시계',weather:'날씨',bus:'버스',todo:'할 일',cal:'일정',photo:'사진',memo:'가족 톡'};
var LAY_DEF={
  land:{clock:[0,0,4,3],weather:[0,3,4,5],bus:[0,8,4,4],todo:[4,0,4,5],cal:[4,5,4,7],photo:[8,0,4,5],memo:[8,5,4,7]},
  port:{clock:[0,0,12,3],todo:[0,3,12,5],cal:[0,8,12,7],weather:[0,15,12,5],memo:[0,20,12,7],photo:[0,27,12,5],bus:[0,32,12,4]}
};
var LAY=null,LMODE='';
function layMode(){return window.innerWidth<window.innerHeight*1.05?'port':'land'}
function layLoad(){var m=layMode(),o=null;try{o=JSON.parse(localStorage.getItem('fb_lay_'+m)||'null')}catch(e){}
  var d=JSON.parse(JSON.stringify(LAY_DEF[m]));
  if(o&&o.pos){for(var k in d)if(o.pos[k])d[k]=o.pos[k]}
  return {mode:m,pos:d,hide:(o&&o.hide)||{},fs:(o&&o.fs)||{}}}
function laySave(){try{localStorage.setItem('fb_lay_'+LAY.mode,JSON.stringify({pos:LAY.pos,hide:LAY.hide,fs:LAY.fs}))}catch(e){}}
function layReset(){try{localStorage.removeItem('fb_lay_'+layMode())}catch(e){}LAY=null;layApply()}
function layApply(){
  if(!LAY||LAY.mode!==layMode())LAY=layLoad();
  var app=$('#app');app.classList.toggle('port',LAY.mode==='port');
  $$('#app .tile').forEach(function(t){var w=t.getAttribute('data-w'),p=LAY.pos[w]||[0,0,4,3],z=(LAY.fs[w]||100)/100;
    t.style.gridColumn=(p[0]+1)+' / span '+p[2];t.style.gridRow=(p[1]+1)+' / span '+p[3];
    t.classList.toggle('hidden',!!LAY.hide[w]&&!app.classList.contains('editing'));
    t.style.opacity=LAY.hide[w]?'.35':'';
    t.style.zoom=z!==1?z:'';t.style.width=z!==1?(100/z)+'%':'';t.style.height=z!==1?(100/z)+'%':'';
    var nm=t.querySelector('.eh .nm');if(nm)nm.textContent=WN[w]+(z!==1?' · 글자 '+Math.round(z*100)+'%':'')+(LAY.hide[w]?' · 숨김':'');
  });
}
function applyScale(){var v=Math.max(60,Math.min(160,parseInt(S.uiScale,10)||100));document.documentElement.style.fontSize=(16*v/100)+'px'}
/* 확대 보기: 각 칸 오른쪽 위 ⤢ */
function zoomTile(t){
  if(t.classList.contains('zoomed')){unzoom();return}
  unzoom();
  var z=window.innerWidth<640?1.15:1.35;t.classList.add('zoomed');t.style.zoom=z;
  t.style.left=(innerWidth*.04/z)+'px';t.style.top=(innerHeight*.04/z)+'px';t.style.width=(innerWidth*.92/z)+'px';t.style.height=(innerHeight*.92/z)+'px';
  $('#zoomBg').style.display='block';
}
function unzoom(){var t=$('#app .tile.zoomed');if(t){t.classList.remove('zoomed');t.style.left=t.style.top='';layApply()}$('#zoomBg').style.display='none'}
$('#zoomBg').onclick=unzoom;
/* 배치 편집 */
function editStart(){unzoom();var app=$('#app');app.classList.add('editing');$('#editBar').className='on';layApply();toast('칸을 끌어서 옮기고, 오른쪽 아래 모서리로 크기를 바꿔요')}
function editEnd(){$('#app').classList.remove('editing');$('#editBar').className='';laySave();layApply();toast('배치를 저장했어요')}
$('#ebDone').onclick=editEnd;
$('#ebReset').onclick=function(){if(confirm('이 기기의 배치를 처음대로 돌릴까요?')){layReset()}};
$('#ebHidden').onclick=function(){var h=Object.keys(LAY.hide).filter(function(k){return LAY.hide[k]});toast(h.length?'숨긴 칸: '+h.map(function(k){return WN[k]}).join(', ')+' · 칸의 👁 를 누르면 다시 보여요':'숨긴 칸이 없어요')};
function setupTiles(){
  $$('#app .tile').forEach(function(t){
    var w=t.getAttribute('data-w');
    if(w!=='photo'){var zb=document.createElement('button');zb.className='zb';zb.textContent='⤢';zb.title='크게 보기';zb.onclick=function(e){e.stopPropagation();zoomTile(t)};t.appendChild(zb)}
    else t.addEventListener('dblclick',function(){});
    var eh=document.createElement('div');eh.className='eh';
    eh.innerHTML='<span class="nm"></span><div class="tb"><button data-a="m">A−</button><button data-a="p">A+</button><button data-a="h">👁</button></div><div class="rs"></div>';
    t.appendChild(eh);
    eh.querySelector('.tb').addEventListener('pointerdown',function(e){e.stopPropagation()});
    eh.querySelector('.tb').onclick=function(e){var b=e.target.closest('button');if(!b)return;var a=b.getAttribute('data-a'),v=LAY.fs[w]||100;
      if(a==='p')LAY.fs[w]=Math.min(180,v+10);if(a==='m')LAY.fs[w]=Math.max(60,v-10);if(a==='h')LAY.hide[w]=!LAY.hide[w];laySave();layApply()};
    eh.addEventListener('pointerdown',function(e){dragStart(e,t,w,e.target.classList.contains('rs'))});
  });
}
var DRG=null;
function cellSize(){var app=$('#app'),cs=getComputedStyle(app),gap=parseFloat(cs.columnGap||cs.gridColumnGap)||12;
  var W=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),cw=(W-gap*11)/12;
  var ch=LAY.mode==='port'?window.innerHeight*.072:(app.clientHeight-parseFloat(cs.paddingTop)-gap*11)/12;
  return {w:cw+gap,h:ch+gap}}
function dragStart(e,t,w,resize){
  if(!$('#app').classList.contains('editing'))return;
  e.preventDefault();var p=LAY.pos[w].slice();
  DRG={t:t,w:w,rs:resize,x:e.clientX,y:e.clientY,p:p,c:cellSize()};
  t.style.zIndex=20;try{e.target.setPointerCapture(e.pointerId)}catch(x){}
}
document.addEventListener('pointermove',function(e){
  if(!DRG)return;e.preventDefault();
  var dx=Math.round((e.clientX-DRG.x)/DRG.c.w),dy=Math.round((e.clientY-DRG.y)/DRG.c.h),p=DRG.p.slice(),maxR=LAY.mode==='port'?60:12;
  if(DRG.rs){p[2]=Math.max(2,Math.min(12-p[0],DRG.p[2]+dx));p[3]=Math.max(2,Math.min(maxR-p[1],DRG.p[3]+dy))}
  else{p[0]=Math.max(0,Math.min(12-p[2],DRG.p[0]+dx));p[1]=Math.max(0,Math.min(maxR-p[3],DRG.p[1]+dy))}
  LAY.pos[DRG.w]=p;layApply();
},{passive:false});
function dragEnd(){if(!DRG)return;DRG.t.style.zIndex='';DRG=null;laySave()}
document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd);
window.addEventListener('resize',function(){if(LAY&&LAY.mode!==layMode()){LAY=null;layApply()}});

/* 시작 */
setupTiles();applyScale();layApply();
window.FB={editStart:editStart,checkRemind:checkRemind,openMonth:openMonth};
cWho=S.me;renderCompose();updRadio();tickClock();applyDim();
refreshAll(true);
setTimeout(nextPhoto,3000);
setInterval(tick,15000);
if(!S.api)setTimeout(function(){openSettings(true)},400);
})();
</script>
